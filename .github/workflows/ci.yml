name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Smoke-test the built CLI on fixtures
        run: |
          node dist/cli.js check fixtures/.env.good fixtures/.env.example --schema fixtures/env.schema.json
          ! node dist/cli.js check fixtures/.env.bad fixtures/.env.example --schema fixtures/env.schema.json
